<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Puzzle - Gravalign Online</title>
        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>
        <header>
            <h1>Gravalign Online</h1>
            <a href="/">Main Menu</a>
        </header>

        <main>
            <section>
                <div class="puzzle-layout">
                    <div id="puzzle-rating-panel" class="rating-panel">
                        <button id="show-puzzle-rating-button" type="button">Show Puzzle Rating</button>
                        <span id="puzzle-rating-display" hidden></span>
                    </div>

                    <div class="board-area">
                        <div id="board" class="board"></div>
                    </div>

                    <div class="below-board-row">
                        <div id="player-rating-panel" class="rating-panel"></div>

                        <div id="player-to-move">
                            <span>Player to move:</span>
                            <span class="piece-marker player-one"></span>
                        </div>
                    </div>

                    <div id="move-status">Choose a column.</div>

                    <div id="puzzle-actions">
                        <button id="try-again-button" type="button" hidden>Try Again</button>
                        <button id="next-puzzle-button" type="button" hidden>Next Puzzle</button>
                    </div>
                </div>
            </section>
        </main>

        <script src="/js/board-renderer.js"></script>
        <script src="/js/puzzle.js"></script>
    </body>
</html>
